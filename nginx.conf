server {
  listen 80;
  server_name _;

  # 静态文件路径
  root /usr/share/nginx/html;
  index index.html;

  # 代理 /api 接口，并添加 CORS 头
  location /api/ {
    proxy_pass http://10.120.164.237:1234/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # CORS 跨域头
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Content-Type, Authorization' always;

    # 响应时间改为5分钟
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 300s;
    send_timeout 300s;
    
    # 预检请求快速返回
    if ($request_method = OPTIONS) {
      return 204;
    }
  }

  # 代理 /api2 接口，并添加 CORS 头
  location /api2/ {
    proxy_pass http://10.120.164.237:8088/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # CORS 跨域头
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Content-Type, Authorization' always;

    # 响应时间改为5分钟
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 300s;
    send_timeout 300s;
    
    # 预检请求快速返回
    if ($request_method = OPTIONS) {
      return 204;
    }
  }

  # 字体文件：PDF 导出所需的中文字体子集每个约 2.3MB，
  # 开启压缩后传输量降到约 1.4MB，并缓存起来避免每次导出重复下载
  location ~* \.(ttf|otf|woff|woff2)$ {
    gzip on;
    gzip_min_length 1024;
    gzip_types font/ttf font/otf font/woff font/woff2 application/font-sfnt application/octet-stream;
    expires 30d;
    add_header Cache-Control "public";
  }

  # 支持 SPA history 模式
  location / {
    try_files $uri $uri/ /index.html;
  }
}